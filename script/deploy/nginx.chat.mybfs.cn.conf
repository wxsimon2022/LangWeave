# chat.mybfs.cn — Nginx 配置
# 部署路径: /etc/nginx/conf.d/chat.mybfs.cn.conf
#
# SSL 证书由 ssl-setup.sh 管理，安装到 /etc/nginx/ssl/
# 首次执行 deploy/ssl/ssl-setup.sh 自动签发
# 证书路径: /etc/nginx/ssl/chat.mybfs.cn.fullchain.cer
#           /etc/nginx/ssl/chat.mybfs.cn.key

# ── HTTP（用于 acme.sh webroot 验证 + 重定向到 HTTPS）──
server {
    listen      80;
    server_name chat.mybfs.cn;
    charset     utf-8;

    # Let's Encrypt HTTP 验证（acme.sh webroot 模式使用）
    location ^~ /.well-known/acme-challenge/ {
        root /usr/local/nginx/html;
    }

    # 其他请求跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────
server {
    listen      443 ssl http2;
    server_name chat.mybfs.cn;
    charset     utf-8;

    ssl_certificate     /etc/nginx/ssl/chat.mybfs.cn.fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/chat.mybfs.cn.key;

    ssl_session_timeout 10m;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20m;

    location / {
        root /home/biu/chat/current/frontend;

        # 宣传页（静态 HTML，无需登录）
        index index.html;
        try_files $uri $uri/ /index.html;

        # Compress HTML/CSS/JS for better SEO performance
        gzip on;
        gzip_types text/css text/plain application/javascript application/json;
        gzip_min_length 1024;
        gzip_vary on;
    }

    location /assets/ {
        root /home/biu/chat/current/frontend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /robots.txt {
        root /home/biu/chat/current/frontend;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /sitemap.xml {
        root /home/biu/chat/current/frontend;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /desktop/ {
        root /home/biu/chat/current/frontend;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
